# Configuration for a single proteome annotation run.
#
# To add another proteome later, copy this file, change `name` + the baserow
# ids/columns, and point the CLI at it:  och-annotate embed -c config/<new>.yaml
name: octopus_chierchiae

baserow:
  base_url: "https://baserow.gofflab.org"
  database_id: 206
  table_id: 1026                 # Transcripts
  # Columns to pull from Baserow as the protein sequence + metadata.
  sequence_column: "protein_sequence"
  id_column: "transcript_id"     # stable per-protein key used for caching/idempotency
  metadata_columns:
    - "gene_id"
    - "transcript_id"
    - "chromosome"
    - "start"
    - "end"
    - "strand"
    - "Ochierchiae_name"
    - "Mmusculus_gene_name"        # mouse ortholog gene name(s)
    - "orthogroup"                 # OrthoFinder orthogroup id
  # Columns written back with results. Created automatically if missing.
  output_columns:
    embedding: "esmc_embedding"      # JSON list[float] (mean-pooled vector)
    model: "esmc_model"              # which ESMC model produced it
    embedded_at: "esmc_embedded_at"  # ISO-8601 UTC timestamp
    sae: "sae_top_features"          # JSON {sae_model: {indices, activations}} (SAE step)

esmc:
  model: "esmc-6b-2024-12"
  url: "https://biohub.ai"
  # Server-side mean pooling -> one vector per protein (cheap transfer, ideal for UMAP).
  pooling: "mean"                # "mean" (return_mean_embedding) or "residue_mean" (local)
  max_sequence_length: 2048      # ESMC limit; longer sequences are skipped + reported
  request_timeout: 120           # per-request HTTP timeout; a stuck read aborts + retries

sae:
  # When models is non-empty, `embed` computes SAE features in the SAME Biohub
  # call as the embedding (no extra token cost) and writes them to the `sae`
  # output column. The two SAEs published for esmc-6b-2024-12 (layer 60, k=64):
  #   - esmc-6b-2024-12-sae-layer60-k64-codebook16384  (16k features; Atlas std)
  #   - esmc-6b-2024-12-sae-layer60-k64-codebook65536  (65k features; finer)
  models:
    - "esmc-6b-2024-12-sae-layer60-k64-codebook16384"
  normalize_features: true
  top_k: 64                      # high-scoring features kept per protein
  pooling: "max"                 # pool per-residue SAE activations: "max" or "mean"
  # Per-feature [start, end, peak] residue spans, from the same per-residue
  # activations the API already returns (no extra Biohub cost). Off by default;
  # turning it on needs a re-run to populate the cache (set run.skip_existing
  # false, or clear the sae column, so existing rows are reprocessed).
  residue_regions: false
  region_threshold: 0.5          # span = residues with activation >= 0.5 * feature peak

run:
  batch_size: 32                 # proteins per checkpoint chunk (small = less lost on a stall)
  max_workers: 16                # concurrent Biohub requests (<=64); steadier than a 64-wide burst
  max_attempts: 10               # retry attempts inside batch_executor
  cache_dir: ".cache/octopus_chierchiae"
  write_baserow: true            # write results back to the Transcripts table
  use_cache: true                # read/write local cache so re-runs never re-call Biohub
  skip_existing: true            # never re-embed proteins that already have an embedding
